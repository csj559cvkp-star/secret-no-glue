<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100c14"><title>Happy Birthday, Andie</title><style>:root{--cream:#f5dfc7;--ink:#120d16;--gold:#d7a861}*{box-sizing:border-box}html,body{margin:0;background:#0d0b10;color:var(--cream);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:hidden}button{font:inherit}.hero{position:relative;min-height:100svh;overflow:hidden;display:flex;align-items:flex-end;isolation:isolate;background:#120f16}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;image-rendering:pixelated;z-index:-3;transform:scale(1.03)}.shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(7,5,9,.82) 0%,rgba(7,5,9,.44) 48%,rgba(7,5,9,.18) 100%),linear-gradient(0deg,rgba(7,5,9,.72) 0%,transparent 50%)}.grain{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.18;background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.025) 3px 4px)}.copy{width:min(900px,100%);padding:clamp(30px,6vw,78px);padding-bottom:max(52px,env(safe-area-inset-bottom));display:grid;gap:18px}.eyebrow{font-size:clamp(10px,1.2vw,13px);letter-spacing:.3em;line-height:1.8;text-transform:uppercase;color:#f1d8bd}.title{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(58px,9vw,118px);line-height:.86;letter-spacing:-.035em;margin:0;text-shadow:0 6px 24px rgba(0,0,0,.35)}.date{font-size:clamp(11px,1.3vw,14px);letter-spacing:.34em}.line{width:70px;height:1px;background:#d9b37c;margin:3px 0 2px}.note{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:clamp(19px,2.2vw,28px);line-height:1.5;margin:0;color:#ead8c8}.begin{margin-top:12px;width:min(290px,74vw);padding:18px 28px;border:1px solid #e2c18e;border-radius:6px;background:rgba(17,12,20,.78);color:#f7e4cf;letter-spacing:.12em;font-family:Georgia,'Times New Roman',serif;font-size:20px;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 12px 30px rgba(0,0,0,.35);backdrop-filter:blur(4px);transition:transform .2s ease,background .2s ease}.begin:active{transform:translateY(2px)}.begin:focus-visible{outline:2px solid #fff;outline-offset:4px}.chapter{min-height:100svh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 0%,#2a1f2d 0%,#171119 52%,#0d0b10 100%)}.chapter-inner{text-align:center;max-width:680px}.chapter small{display:block;letter-spacing:.28em;color:#c9a982;margin-bottom:18px}.chapter h2{font-family:Georgia,'Times New Roman',serif;font-size:clamp(44px,8vw,84px);font-weight:400;margin:0 0 18px}.chapter p{margin:0 auto;max-width:420px;line-height:1.8;color:#d9ccd8}@media(max-width:700px){.hero{min-height:100svh}.art{object-position:58% center;transform:scale(1.08)}.shade{background:linear-gradient(180deg,rgba(7,5,9,.34),rgba(7,5,9,.14) 35%,rgba(7,5,9,.78) 100%),linear-gradient(90deg,rgba(7,5,9,.55),transparent 74%)}.copy{align-self:end;padding:24px 24px max(44px,env(safe-area-inset-bottom));gap:13px}.eyebrow{font-size:10px;max-width:240px}.title{font-size:clamp(54px,16vw,82px);line-height:.89}.note{font-size:19px}.begin{width:min(270px,80vw);font-size:18px;padding:16px 24px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body><main><section class="hero" aria-label="Birthday opening for Andie"><img class="art" src="assets/hero-clean.svg" alt="Pixel-art inspired nighttime birthday scene"><div class="shade"></div><div class="grain"></div><div class="copy"><div class="eyebrow">to a girl who makes the world softer</div><h1 class="title">Happy<br>Birthday<br>Andie</h1><div class="date">09 · 16 · 06</div><div class="line"></div><p class="note">Same you.<br>Brighter days.<br>A happier you.</p><button class="begin" id="begin">Begin&nbsp;&nbsp;→</button></div></section><section class="chapter" id="chapter"><div class="chapter-inner"><small>CHAPTER ONE</small><h2>This one is for you.</h2><p>Keep going.</p></div></section></main><script>document.getElementById('begin').addEventListener('click',()=>document.getElementById('chapter').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));</script></body></html>
